name: Validate code-only release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Run synthetic protocol tests
        run: python -m pytest -q
      - name: Check command-line entry points
        run: |
          python scripts/run_cdp.py --help
          python scripts/build_condition_manifest.py --help
          python scripts/normalize_predictions.py --help
          python scripts/run_model_inference.py --help
